<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AI Student Performance & Placement System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            padding: 35px;

            background: white;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.2);
        }

        .logo-container {
            text-align: center;

            margin-bottom: 15px;
        }

        .project-logo {
            width: 100px;
            height: 100px;

            object-fit: contain;
        }

        h1 {
            margin: 10px 0 5px;

            text-align: center;

            font-size: 24px;

            color: #333;
        }

        .subtitle {
            margin-bottom: 25px;

            text-align: center;

            color: #777;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #444;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #667eea;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .alert {
            margin-bottom: 15px;

            padding: 10px;

            border-radius: 7px;

            text-align: center;

            font-size: 14px;
        }

        .alert-danger {
            background: #f8d7da;

            color: #842029;
        }

        .alert-success {
            background: #d1e7dd;

            color: #0f5132;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <!-- PROJECT LOGO -->

        <div class="logo-container">

            <img
                src="{{ url_for(
                    'static',
                    filename='logo/logo.png'
                ) }}"
                alt="Project Logo"
                class="project-logo"
            >

        </div>


        <!-- TITLE -->

        <h1>
            AI Student Performance
            & Placement System
        </h1>

        <div class="subtitle">
            Admin Login
        </div>


        <!-- FLASH MESSAGES -->

        {% with messages = get_flashed_messages(
            with_categories=true
        ) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div
                        class="alert alert-{{ category }}"
                    >
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- LOGIN FORM -->

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>

    </div>

</body>
</html>
